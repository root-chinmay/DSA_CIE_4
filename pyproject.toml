[project]
name = "dsa-offline-lan-sync"
version = "1.0.0"
description = "DSA-Based Offline LAN File Sharing & Synchronization System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.0",
    "requests>=2.31.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
